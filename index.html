<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>समसामयिक Quiz</title>
<meta name="description" content="Daily GK live exam questions, date-wise practice quiz.">
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4; --card:#fff; --ink:#12120f; --ink2:#5a5954; --mut:#8b8a83;
  --line:#e3e2db; --brand:#2a6fd6; --brandsoft:#e8f0fc;
  --ok:#0d8a3f; --oksoft:#e3f5e9; --bad:#c8372d; --badsoft:#fdeceb;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-t="light"]){
  color-scheme:dark;
  --bg:#111110; --card:#1b1b19; --ink:#f3f2ed; --ink2:#b6b5ad; --mut:#87867e;
  --line:#302f2b; --brand:#6ea6f0; --brandsoft:#16243a;
  --ok:#4cc07a; --oksoft:#14291d; --bad:#f0796d; --badsoft:#2e1917;
}}
:root[data-t="dark"]{
  color-scheme:dark;
  --bg:#111110; --card:#1b1b19; --ink:#f3f2ed; --ink2:#b6b5ad; --mut:#87867e;
  --line:#302f2b; --brand:#6ea6f0; --brandsoft:#16243a;
  --ok:#4cc07a; --oksoft:#14291d; --bad:#f0796d; --badsoft:#2e1917;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Devanagari",system-ui,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 96px}
.hide{display:none!important}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);
 background:var(--card);color:var(--ink);padding:11px 15px;transition:.12s}
button:hover{border-color:var(--brand)}
.big{display:block;width:100%;background:var(--brand);color:#fff;border:0;
 padding:16px;font-size:17px;font-weight:650;border-radius:12px}
.big:hover{filter:brightness(1.07)}
.big.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.lbl{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
 color:var(--mut);margin:0 0 10px}
.dates{display:grid;gap:8px}
.dt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px}
.dt .n{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
.dt .ad{color:var(--mut);font-size:12.5px}
.dt.on{border-color:var(--brand);background:var(--brandsoft)}
.dt .nm{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
 background:var(--card);color:var(--ink)}
/* quiz */
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-bottom:16px}
.qt{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 16px}
.opts{display:grid;gap:9px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;font-size:16px}
.op b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);
 border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2)}
.op.pick{border-color:var(--brand);background:var(--brandsoft)}
.op.ok{border-color:var(--ok);background:var(--oksoft)}
.op.ok b{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--badsoft)}
.op.bad b{background:var(--bad);color:#fff;border-color:var(--bad)}
.op:disabled{cursor:default;opacity:1}
.exp{margin-top:14px;padding:13px;border-radius:11px;background:var(--bg);
 border-left:3px solid var(--brand);font-size:14.5px;color:var(--ink2)}
.exp .src{display:block;margin-top:8px;font-size:12.5px;color:var(--mut)}
.exp a{color:var(--brand)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);
 border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1}
.nav .go{background:var(--brand);color:#fff;border:0;font-weight:650}
/* result */
.score{text-align:center;padding:26px 16px}
.score .pc{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em}
.score .of{color:var(--mut);margin-top:8px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill.ok{background:var(--oksoft);color:var(--ok)}
.pill.bad{background:var(--badsoft);color:var(--bad)}
.rev{padding:13px 0;border-top:1px solid var(--line)}
.rev p{margin:0 0 6px;font-weight:600;font-size:15px}
.rev .ln{font-size:14px;color:var(--ink2)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top .sp{margin-left:auto}
.ghost{border:0;background:transparent;color:var(--mut);padding:6px 8px;font-size:13px}
.ghost:hover{color:var(--brand)}
footer{margin-top:26px;color:var(--mut);font-size:12.5px;text-align:center;line-height:1.7}
footer a{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= HOME ================= -->
<section id="home">
  <div class="top">
    <div>
      <h1>समसामयिक Quiz</h1>
      <p class="sub" id="tagline"></p>
    </div>
    <button class="ghost sp" id="theme">◐</button>
  </div>

  <button class="big" id="startAll">सबै प्रश्न — Start</button>
  <div style="height:10px"></div>
  <button class="big sec" id="startRandom">Random 20</button>

  <div class="card" style="margin-top:18px">
    <p class="lbl">मिति छान्नुहोस् · Pick dates</p>
    <div class="dates" id="dates"></div>
    <div class="row" style="margin-top:12px">
      <button id="clearSel" class="ghost">Clear</button>
      <span class="sp" style="margin-left:auto"></span>
      <select id="count">
        <option value="0">All questions</option>
        <option value="10">10 questions</option>
        <option value="20" selected>20 questions</option>
        <option value="30">30 questions</option>
      </select>
    </div>
    <div style="height:12px"></div>
    <button class="big" id="startSel" disabled>छानिएको मितिबाट सुरु</button>
  </div>

  <div class="card" id="statsCard">
    <p class="lbl">तपाईंको प्रगति</p>
    <div class="row" style="justify-content:space-between">
      <div><b id="stAtt">0</b> <span class="sub">quizzes</span></div>
      <div><b id="stAns">0</b> <span class="sub">answered</span></div>
      <div><b id="stAcc">—</b> <span class="sub">accuracy</span></div>
      <div><b id="stBest">—</b> <span class="sub">best</span></div>
    </div>
    <div style="height:10px"></div>
    <button class="ghost" id="reset">Reset progress</button>
  </div>

  <footer id="foot"></footer>
</section>

<!-- ================= QUIZ ================= -->
<section id="quiz" class="hide">
  <div class="bar"><i id="prog"></i></div>
  <div class="meta"><span id="pos"></span><span id="tally"></span></div>
  <p class="qt" id="qt"></p>
  <div class="opts" id="opts"></div>
  <div id="exp"></div>
</section>

<!-- ================= RESULT ================= -->
<section id="done" class="hide">
  <div class="card score">
    <div class="pc" id="rPc"></div>
    <div class="of" id="rOf"></div>
  </div>
  <button class="big" id="again">फेरि खेल्नुहोस्</button>
  <div style="height:10px"></div>
  <button class="big sec" id="home2">Home</button>
  <div class="card" style="margin-top:16px">
    <p class="lbl">Review</p>
    <div id="review"></div>
  </div>
</section>

</div>

<div class="nav hide" id="nav"><div class="in">
  <button id="quit">Quit</button>
  <button class="go" id="next">Next</button>
</div></div>

const KEY = 'gkquiz.v2';

/* ---------- storage ---------- */
const blank = {att:0, ans:0, ok:0, best:0};
function load(){ try{ return Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ return Object.assign({}, blank); } }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
function paintStats(){
  const s = load();
  $('stAtt').textContent = s.att;
  $('stAns').textContent = s.ans;
  $('stAcc').textContent = s.ans ? Math.round(s.ok/s.ans*100)+'%' : '—';
  $('stBest').textContent = s.best ? s.best+'%' : '—';
}

const sel = new Set();
$('tagline').textContent = DATA.questions.length + ' प्रश्न · ' + DATA.dates.length + ' दिन';
$('foot').innerHTML = 'Questions transcribed from the <b>GK For All — Daily GK live exam</b> '
  + 'sessions by Aashman Upadhaya. Study aid only; all credit to the original channel.'
  + '<br>Built ' + JSON.stringify("2026-09-06").replace(/"/g,'') + ' · works offline.';

function drawDates(){
  const el = $('dates'); el.innerHTML = '';
  DATA.dates.forEach(d => {
    const b = document.createElement('button');
    b.className = 'dt' + (sel.has(d.key) ? ' on' : '');
    b.innerHTML = '<span><span class="nm">' + d.bs + '</span><br><span class="ad">' + d.ad + '</span></span>'
                + '<span class="n">' + d.n + '</span>';
    b.onclick = () => { sel.has(d.key) ? sel.delete(d.key) : sel.add(d.key); drawDates(); syncSel(); };
    el.appendChild(b);
  });
}
function syncSel(){
  const n = DATA.questions.filter(q => sel.has(q.key)).length;
  const b = $('startSel');
  b.disabled = !n;
  b.textContent = n ? ('सुरु गर्नुहोस् — ' + n + ' प्रश्न') : 'छानिएको मितिबाट सुरु';
}
$('clearSel').onclick = () => { sel.clear(); drawDates(); syncSel(); };

/* ---------- quiz engine ---------- */
let Q = null;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

function begin(list, cap){
  if (!list.length) return;
  let items = shuffle(list);
  if (cap && cap < items.length) items = items.slice(0, cap);
  Q = { items: items.map(q => ({q, order: shuffle(q.o.map((_,i)=>i)), pick:null})), i:0, ok:0 };
  show('quiz'); $('nav').classList.remove('hide'); render();
}
function show(which){
  ['home','quiz','done'].forEach(s => $(s).classList.toggle('hide', s !== which));
  if (which !== 'quiz') $('nav').classList.add('hide');
  window.scrollTo(0,0);
}
function render(){
  const it = Q.items[Q.i], q = it.q;
  $('prog').style.width = ((Q.i)/Q.items.length*100) + '%';
  $('pos').textContent = 'प्रश्न ' + (Q.i+1) + ' / ' + Q.items.length;
  $('tally').textContent = q.bs;
  $('qt').textContent = q.q;
  const box = $('opts'); box.innerHTML = '';
  const letters = ['क','ख','ग','घ'];
  it.order.forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = '<b>' + (letters[k]||k+1) + '</b><span>' + esc(q.o[oi]) + '</span>';
    if (it.pick !== null){
      b.disabled = true;
      if (oi === q.a) b.className = 'op ok';
      else if (oi === it.pick) b.className = 'op bad';
    } else {
      b.onclick = () => answer(oi);
    }
    box.appendChild(b);
  });
  $('exp').innerHTML = it.pick === null ? '' : expHtml(q);
  $('next').textContent = it.pick === null ? 'Skip'
      : (Q.i === Q.items.length-1 ? 'नतिजा हेर्नुहोस्' : 'Next');
}
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function secs(ts){ const p = ts.split(':').map(Number); while(p.length<3) p.unshift(0); return p[0]*3600+p[1]*60+p[2]; }
function expHtml(q){
  const url = 'https://www.youtube.com/watch?v=' + q.vid + '&t=' + secs(q.ts) + 's';
  return '<div class="exp">' + esc(q.e)
       + '<span class="src">' + esc(q.bs) + ' · ' + esc(q.t)
       + ' · <a href="' + url + '" target="_blank" rel="noopener">भिडियोमा हेर्नुहोस् ' + q.ts + '</a></span></div>';
}
function answer(oi){
  const it = Q.items[Q.i];
  if (it.pick !== null) return;
  it.pick = oi;
  if (oi === it.q.a) Q.ok++;
  render();
}
$('next').onclick = () => {
  if (Q.i < Q.items.length - 1){ Q.i++; render(); }
  else finish();
};
$('quit').onclick = () => { if (confirm('Quiz छोड्ने?')) show('home'); };

function finish(){
  const n = Q.items.length, pc = Math.round(Q.ok/n*100);
  const s = load();
  s.att++; s.ans += n; s.ok += Q.ok; s.best = Math.max(s.best||0, pc);
  save(s); paintStats();
  $('rPc').textContent = pc + '%';
  $('rOf').innerHTML = Q.ok + ' / ' + n + ' सही &nbsp; '
    + '<span class="pill ' + (pc>=60?'ok':'bad') + '">' + (pc>=60?'राम्रो':'अभ्यास चाहियो') + '</span>';
  const wrong = Q.items.filter(it => it.pick !== it.q.a);
  $('review').innerHTML = wrong.length
    ? wrong.map(it => '<div class="rev"><p>' + esc(it.q.q) + '</p>'
        + '<div class="ln">✓ <b>' + esc(it.q.o[it.q.a]) + '</b>'
        + (it.pick === null ? ' &nbsp;<span class="pill bad">skipped</span>'
                            : '<br>✗ तपाईंको: ' + esc(it.q.o[it.pick])) + '</div>'
        + expHtml(it.q) + '</div>').join('')
    : '<p class="sub">सबै सही! केही छुटेन।</p>';
  show('done');
}

/* ---------- buttons ---------- */
$('startAll').onclick    = () => begin(DATA.questions, 0);
$('startRandom').onclick = () => begin(DATA.questions, 20);
$('startSel').onclick    = () => begin(DATA.questions.filter(q => sel.has(q.key)), +$('count').value);
$('again').onclick       = () => begin(Q.items.map(it => it.q), 0);
$('home2').onclick       = () => show('home');
$('reset').onclick       = () => { if (confirm('Progress मेटाउने?')){ save(Object.assign({}, blank)); paintStats(); } };
$('theme').onclick = () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-t') === 'dark'
    || (!r.getAttribute('data-t') && matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-t', dark ? 'light' : 'dark');
  try{ localStorage.setItem('gkquiz.theme', dark ? 'light' : 'dark'); }catch(e){}
};
try{ const t = localStorage.getItem('gkquiz.theme'); if (t) document.documentElement.setAttribute('data-t', t); }catch(e){}

drawDates(); syncSel(); paintStats();
</script>
</body>
</html>
